<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINK Community Brief Admin</title><link rel="stylesheet" href="/business/styles.css"></head><body><main class="portal-main" style="max-width:1000px;margin:auto"><header class="portal-header"><div><div class="eyebrow">LINK ADMIN</div><h1>Community Brief</h1></div></header><article class="panel"><label>LINK Admin Secret<input id="secret" type="password" autocomplete="off"></label><label>Edition month<input id="month" type="month"></label><button id="generate" class="primary">Generate Draft</button><p id="status" class="status"></p></article><article id="editor" class="panel hidden"><label>Subject<input id="subject"></label><label>Preview text<input id="preview"></label><label>Intro note<textarea id="intro"></textarea></label><div class="button-row"><button id="approve" class="primary">Approve Draft</button><button id="view" class="secondary">View HTML</button></div><label>Schedule send<input id="sendAt" type="datetime-local"></label><button id="schedule" class="primary">Schedule in Resend</button><div id="previewBox"></div></article></main><script>const $=s=>document.querySelector(s);let edition=null;month.value=new Date().toISOString().slice(0,7);function h(){return {'Content-Type':'application/json','Authorization':'Bearer '+secret.value}}async function post(u,b){const r=await fetch(u,{method:'POST',headers:h(),body:JSON.stringify(b)}),j=await r.json();if(!r.ok)throw new Error(j.error);return j}generate.onclick=async()=>{try{status.textContent='Generating…';const j=await post('/api/community-brief/admin/generate',{month:month.value});edition=j.edition;subject.value=edition.subject;preview.value=edition.preview_text||'';intro.value=edition.intro_note||'';editor.classList.remove('hidden');status.textContent='Draft generated from current LINK data.'}catch(e){status.textContent=e.message}};approve.onclick=async()=>{try{const j=await post('/api/community-brief/admin/approve',{id:edition.id,subject:subject.value,previewText:preview.value,introNote:intro.value});edition=j.edition;status.textContent='Approved. Review HTML, then schedule.'}catch(e){status.textContent=e.message}};view.onclick=async()=>{try{const r=await fetch('/api/community-brief/admin/render?id='+encodeURIComponent(edition.id),{headers:{Authorization:'Bearer '+secret.value}}),j=await r.json();if(!r.ok)throw new Error(j.error);previewBox.innerHTML='<iframe style="width:100%;height:700px;border:1px solid #ddd" sandbox="allow-popups"></iframe>';previewBox.querySelector('iframe').srcdoc=j.html}catch(e){status.textContent=e.message}};schedule.onclick=async()=>{try{if(!confirm('Schedule this approved Community Brief in Resend?'))return;const when=new Date(sendAt.value).toISOString();const j=await post('/api/community-brief/admin/schedule',{id:edition.id,scheduledAt:when});status.textContent='Scheduled in Resend: '+j.scheduledAt}catch(e){status.textContent=e.message}};</script></body></html>
