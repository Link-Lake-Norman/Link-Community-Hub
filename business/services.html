<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nonprofit Service Listings | LINK Business Portal™</title><link rel="stylesheet" href="/business/styles.css"></head><body><main class="portal-main" style="max-width:1000px;margin:auto"><header class="portal-header"><div><div class="eyebrow">LINK BUSINESS PORTAL™</div><h1>Services for Nonprofits</h1></div><a href="/business/portal.html">Back to Dashboard</a></header><div id="status" class="global-status"></div><article id="gate" class="panel hidden"><h2>Nonprofit Service Partner</h2><p>Your current plan does not include promoted professional-service listings. LINK can enable this as a paid visibility benefit without taking a referral commission.</p></article><article id="formPanel" class="panel"><form id="f"><label>Service title *<input id="title" required></label><label>Category *<select id="category" required><option value="">Choose</option><option>Accounting & Finance</option><option>Banking</option><option>Legal</option><option>HR & Payroll</option><option>Insurance</option><option>IT & Cybersecurity</option><option>Marketing & Communications</option><option>Web & Design</option><option>Printing & Promotional</option><option>Grant Support</option><option>Fundraising Consulting</option><option>Events</option><option>Training & Facilitation</option><option>Facilities & Maintenance</option><option>Other Professional Services</option></select></label><label>Description *<textarea id="description" required maxlength="2400"></textarea></label><label>Website<input id="website" type="url"></label><label>Service area<input id="area" value="Lake Norman"></label><label>Pricing note<input id="pricing"></label><label>Nonprofit discount / special offering<input id="discount"></label><label class="check-row"><input id="probono" type="checkbox"><span>Pro bono services may be available.</span></label><button class="primary">Submit Service Listing</button></form></article><div id="list" class="card-grid"></div></main><script>const $=s=>document.querySelector(s),e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(u,o={}){const r=await fetch(u,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...o}),j=await r.json();if(r.status===401){location.href='/business/';throw new Error('Sign in required')}if(!r.ok)throw new Error(j.error);return j}async function load(){const j=await api('/api/business/services');$('#gate').classList.toggle('hidden',j.enabled);$('#formPanel').classList.toggle('hidden',!j.enabled);$('#list').innerHTML=(j.services||[]).map(s=>`<article class="resource-card"><span class="badge ${e(s.status)}">${e(s.status)}</span><h3>${e(s.title)}</h3><p>${e(s.category)}</p><p>${e(s.description)}</p></article>`).join('')}$('#f').onsubmit=async x=>{x.preventDefault();try{await api('/api/business/services',{method:'POST',body:JSON.stringify({title:title.value,category:category.value,description:description.value,website:website.value,serviceArea:area.value,pricingNote:pricing.value,nonprofitDiscountNote:discount.value,proBonoAvailable:probono.checked})});x.target.reset();await load();$('#status').textContent='Service submitted for LINK approval.'}catch(z){$('#status').textContent=z.message}};load().catch(z=>$('#status').textContent=z.message)</script></body></html>
