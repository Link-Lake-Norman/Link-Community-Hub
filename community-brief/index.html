<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINK Community Brief™</title><link rel="stylesheet" href="/business/styles.css"></head><body><main class="auth-page"><section class="auth-card"><img src="/lakenorman/assets/brand/link-primary-logo.png" alt="LINK Community Hub" style="max-width:280px;width:80%;display:block;margin:0 auto 24px"><div class="eyebrow">MONTHLY · SENT ON THE 5TH</div><h1>The LINK Community Brief</h1><p>Local needs, nonprofit stories, events, resources, businesses, volunteers and measurable community connection across Lake Norman.</p><form id="f"><label>First name<input id="first"></label><label>Last name<input id="last"></label><label>Email *<input id="email" type="email" required></label><label>Organization<input id="org"></label><label>I am a<select id="role"><option value="community">Community member</option><option value="nonprofit">Nonprofit</option><option value="business">Business</option><option value="school">School</option><option value="volunteer">Volunteer</option><option value="organization">Organization / Group</option></select></label><label class="check-row"><input id="consent" type="checkbox" required><span>Yes, send me the monthly LINK Community Brief. I can unsubscribe at any time.</span></label><button class="primary" type="submit">Subscribe</button><p id="s" class="status"></p></form></section></main><script>document.querySelector('#f').onsubmit=async e=>{e.preventDefault();const s=document.querySelector('#s');s.textContent='Subscribing…';try{const r=await fetch('/api/community-brief/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({firstName:first.value,lastName:last.value,email:email.value,organizationName:org.value,roleType:role.value,consent:consent.checked,source:'community-brief-page'})});const j=await r.json();if(!r.ok)throw new Error(j.error);s.className='status success';s.textContent=j.message;e.target.reset()}catch(x){s.className='status error';s.textContent=x.message}}</script></body></html>
