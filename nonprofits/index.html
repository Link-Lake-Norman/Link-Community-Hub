<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINK Nonprofit Portal™</title><link rel="stylesheet" href="/business/styles.css"></head><body><main class="auth-page"><section class="auth-card"><img src="/lakenorman/assets/brand/link-primary-logo.png" alt="LINK Community Hub" style="max-width:280px;width:80%;display:block;margin:0 auto 24px"><div class="eyebrow">NONPROFIT PORTAL</div><h1>Share needs. Tell your story. Connect locally.</h1><p>Approved LINK nonprofits can manage community photos and stories and connect with participating service providers.</p><form id="login"><label>Authorized nonprofit email<input id="email" type="email" required></label><button class="primary" type="submit">Email My Secure Sign-In Link</button><p id="status" class="status"></p></form></section></main><script>document.querySelector('#login').onsubmit=async e=>{e.preventDefault();const s=document.querySelector('#status');s.textContent='Sending…';try{const r=await fetch('/api/nonprofits/portal/auth/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.querySelector('#email').value})});const j=await r.json();if(!r.ok)throw new Error(j.error);s.className='status success';s.textContent=j.message;}catch(x){s.className='status error';s.textContent=x.message;}};</script></body></html>
