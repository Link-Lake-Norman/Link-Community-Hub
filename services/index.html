<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nonprofit Services | LINK Community Hub™</title><link rel="stylesheet" href="/business/styles.css"></head><body><main class="portal-main" style="max-width:1100px;margin:auto"><header class="portal-header"><img src="/lakenorman/assets/brand/link-horizontal-logo.png" alt="LINK Community Hub" style="max-width:300px"><a href="/">Back to LINK</a></header><section><div class="eyebrow">NONPROFIT SERVICES MARKETPLACE</div><h1>Businesses that serve nonprofits.</h1><p>Browse participating service providers. LINK facilitates visibility and introductions; listings are not certifications or endorsements.</p><div id="list" class="card-grid"></div></section></main><script>const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('/api/services/public').then(r=>r.json()).then(j=>{document.querySelector('#list').innerHTML=(j.services||[]).map(s=>`<article class="resource-card">${s.business_logo_url?`<img src="${e(s.business_logo_url)}" alt="${e(s.business_name)} logo" style="max-height:60px;max-width:150px">`:''}<div class="panel-kicker">${e(s.category)}</div><h3>${e(s.title)}</h3><p><strong>${e(s.business_name)}</strong></p><p>${e(s.description)}</p>${s.nonprofit_discount_note?`<p><strong>Nonprofit offering:</strong> ${e(s.nonprofit_discount_note)}</p>`:''}${s.pro_bono_available?'<p><strong>Pro bono may be available.</strong></p>':''}<p><a href="/nonprofits/">Sign in as an approved nonprofit to request an introduction.</a></p></article>`).join('')||'<div class="empty-state">Service partner listings are coming soon.</div>'});</script></body></html>
